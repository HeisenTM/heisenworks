name: Update works list
on:
  push:
    branches: [main]
    paths: ['works/**', '!works/manifest.js']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update-works.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add works/manifest.js
          if ! git diff --cached --quiet; then
            git commit -m "Update works list"
            git push
          fi
